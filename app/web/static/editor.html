<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор — Контент-завод</title>
<link rel="stylesheet" href="/static/app.css?v=14">
<style>
  .ed { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 22px; align-items: start; }
  .stage-wrap { position: sticky; top: 16px; display: grid; gap: 10px; }
  .stage { position: relative; width: 360px; height: 640px; border-radius: 14px; overflow: hidden; background: #0f1218;
           box-shadow: var(--shadow); user-select: none; touch-action: none; }
  .stage canvas, .stage img.exact { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage img.exact { pointer-events: none; }
  .ov { position: absolute; inset: 0; }
  .box { position: absolute; border: 1.5px dashed rgba(255,255,255,.55); border-radius: 3px; cursor: move; }
  .box:hover { border-color: #fff; }
  .box.sel { border: 2px solid var(--c); }
  .box .tag { position: absolute; top: -19px; left: -2px; font-size: 10px; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 4px; white-space: nowrap; background: var(--c); display: none; }
  .box.sel .tag { display: block; }
  .box .h { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--c); display: none; }
  .box.sel .h { display: block; }
  .h.nw { left: -7px; top: -7px; cursor: nwse-resize; } .h.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .h.ne { right: -7px; top: -7px; cursor: nesw-resize; } .h.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .h.n, .h.s { left: calc(50% - 6px); border-radius: 3px; cursor: ns-resize; } .h.n { top: -7px; } .h.s { bottom: -7px; }
  .h.e, .h.w { top: calc(50% - 6px); border-radius: 3px; cursor: ew-resize; } .h.e { right: -7px; } .h.w { left: -7px; }
  .box.video { --c: #0ea5e9; } .box.banner { --c: #db2777; } .box.text { --c: #ca8a04; }
  .box.empty-text { border-color: rgba(250, 204, 21, .9); background: rgba(250, 204, 21, .12); }
  .box.empty-text::after { content: 'текст: нажмите и введите'; position: absolute; inset: 0; display: grid; place-items: center; color: #fde68a; font-size: 11px; font-weight: 600; }
  .guide { position: absolute; background: #f472b6; pointer-events: none; display: none; }
  .guide.v { width: 1px; top: 0; bottom: 0; left: 50%; } .guide.hz { height: 1px; left: 0; right: 0; top: 50%; }
  .stage.playing .ov { opacity: .25; }
  .stage .fallback { position: absolute; inset: auto 8px 8px 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.6); border-radius: 6px; padding: 4px 8px; }
  .transport { display: flex; gap: 8px; align-items: center; }
  .transport input { flex: 1; }
  .transport .btn { width: 44px; }
  .pos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pos .btn { padding: 6px 4px; font-size: 12px; }
  .panel { display: grid; gap: 12px; }
  details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  details.sec summary { padding: 13px 16px; font-weight: 650; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  details.sec summary::-webkit-details-marker { display: none; }
  details.sec summary::after { content: '▾'; color: var(--muted); }
  details.sec[open] summary::after { content: '▴'; }
  details.more summary { color: var(--text-2); font-weight: 600; }
  .sec .body { padding: 0 16px 16px; display: grid; gap: 12px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .sl { display: grid; gap: 2px; font-size: 12px; color: var(--text-2); font-weight: 500; }
  .sl .top { display: flex; justify-content: space-between; } .sl .top span { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); padding: 2px; cursor: pointer; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .tpl { border: 2px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--surface); padding: 0; font: inherit; text-align: left; }
  .tpl:hover { border-color: var(--accent); }
  .tpl.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
  .tpl canvas { width: 100%; aspect-ratio: 9/16; display: block; background: #0f1218; }
  .tpl div { font-size: 11px; line-height: 1.25; padding: 5px 6px; height: 38px; overflow: hidden; color: var(--text-2); }
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .asset { border: 2px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: repeating-conic-gradient(#e5e7eb 0 25%, #fff 0 50%) 0 0/12px 12px; aspect-ratio: 9/16; position: relative; }
  .asset img { width: 100%; height: 100%; object-fit: contain; }
  .asset.on { border-color: var(--accent); }
  .asset .k { position: absolute; bottom: 2px; left: 2px; font-size: 9px; background: rgba(0,0,0,.6); color: #fff; padding: 0 4px; border-radius: 3px; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }
  .warnbox { font-size: 12px; background: var(--warn-bg); color: #7a4a06; border-radius: 8px; padding: 8px 10px; }
  .tcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  .tcard.sel { border-color: #ca8a04; box-shadow: 0 0 0 3px #fef3c7; }
  .tcard textarea { min-height: 54px; }
  .trim { position: relative; height: 34px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-2); }
  .trim .keep { position: absolute; top: 0; bottom: 0; background: var(--accent-2); border-left: 3px solid var(--accent); border-right: 3px solid var(--accent); cursor: grab; }
  .trim .hd { position: absolute; top: -2px; bottom: -2px; width: 12px; margin-left: -6px; cursor: ew-resize; z-index: 2; }
  .trim .ph { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--err); pointer-events: none; }
  .substyles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .substyle { border: 2px solid var(--line); border-radius: 10px; padding: 0; background: #3a4150; cursor: pointer; overflow: hidden; font: inherit; }
  .substyle canvas { width: 100%; display: block; }
  .substyle span { display: block; font-size: 11px; padding: 3px; background: var(--surface); color: var(--text-2); }
  .substyle.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
  .box.subs { --c: #16a34a; cursor: ns-resize; }
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .pick { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
  .pick img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: var(--surface-2); }
  .pick .cap { padding: 6px 8px; font-size: 12px; display: grid; gap: 4px; }
  .pick .cap div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick input { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; z-index: 2; }
  .pick.sel { border-color: var(--accent); }
  @media (max-width: 1000px) { .ed { grid-template-columns: 1fr; } .stage-wrap { position: static; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"></main>
</div>
<script src="/static/app.js?v=20"></script>
<script src="/static/compose.js?v=3"></script>
<script>
const D = 360 / 1080;  // stage display scale (spec pixels → screen pixels)
const itemId = +new URLSearchParams(location.search).get('item') || null;
let P = null, S = null, ASSETS = [], TEMPLATES = [], at = 1.0, dirty = false, sel = { kind: 'video' };
let VOICES = [], voiceAudio = null;
const SUB_STYLES = {
  classic: { label: 'Классика', font: 'heavy', color: '#ffffff', stroke: 0.10, stroke_color: '#000000', box: false, karaoke: false, uppercase: false },
  karaoke: { label: 'Караоке', font: 'heavy', color: '#ffffff', stroke: 0.10, stroke_color: '#000000', box: false, karaoke: true, highlight: '#ffd600', uppercase: false },
  box: { label: 'Плашка', font: 'regular', color: '#ffffff', stroke: 0, box: true, box_color: '#000000b0', karaoke: false, uppercase: false },
  white_box: { label: 'Белая плашка', font: 'heavy', color: '#111111', stroke: 0, box: true, box_color: '#ffffffee', karaoke: false, uppercase: false },
  impact: { label: 'Мем Impact', font: 'impact', color: '#ffffff', stroke: 0.12, stroke_color: '#000000', box: false, karaoke: false, uppercase: true },
  yellow: { label: 'Жёлтые', font: 'heavy', color: '#ffd600', stroke: 0.10, stroke_color: '#000000', box: false, karaoke: false, uppercase: false },
  neon: { label: 'Неон', font: 'rounded', color: '#7cff4f', stroke: 0.08, stroke_color: '#06320b', box: false, karaoke: true, highlight: '#ffffff', uppercase: false },
};
let comp = null, media = null, playing = false, saveTimer = null, exactTimer = null, exactSeq = 0;

const get = (o, path) => path.split('.').reduce((a, k) => a == null ? a : a[k], o);
const set = (o, path, v) => { const ks = path.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
const clone = o => JSON.parse(JSON.stringify(o));
const total = () => totalDuration(S, P.item.duration);
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;

// ================= picker (no item): open a video, or a template for many at once =================
let pickState = { onlyNew: true, checked: false, txt: '', cat: '', chosen: new Set(), last: null, items: [] };
async function picker() {
  renderSidebar('editor');
  const [tpls, auto] = await Promise.all([api('/api/editor/templates'), api('/api/editor/auto-templates')]);
  TEMPLATES = tpls.templates;
  $('#main').innerHTML = `
    <div class="page-head"><div><h1>Редактор</h1>
      <p class="sub">Нажмите на ролик, чтобы открыть его. Для пачки: отметьте ролики (Shift — диапазон), выберите шаблон и отправьте в «Готовые».</p></div></div>
    <section class="card" style="margin-bottom:14px;display:grid;gap:10px">
      <div class="row">
        <select id="tpl" style="min-width:260px">${TEMPLATES.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
        <select id="bgSel" style="min-width:200px"><option value="">фон как в шаблоне</option><option value="random">🎲 каждому случайный неиспользованный фон</option></select>
        <button class="btn primary" id="apply" disabled>Шаблон и в «Готовые»</button>
        <span class="spacer"></span><button class="btn ghost sm" id="all">выбрать все</button><button class="btn ghost sm" id="none">снять</button><span class="muted small" id="selN">выбрано: 0</span>
      </div>
      <div id="progress" class="small muted"></div>
    </section>
    <div class="row" style="margin-bottom:12px"><div class="chips" id="filt"></div><span class="spacer"></span>
      <details class="sec" style="box-shadow:none"><summary style="padding:6px 12px">⚙️ Авто-шаблоны по категориям</summary><div class="body" id="auto" style="min-width:360px"></div></details></div>
    <div class="pick-grid" id="grid"></div>`;
  renderAuto(auto.mapping);
  api('/api/backgrounds?used=').then(b => { $('#bgSel').innerHTML += b.items.map(x => `<option value="${x.id}">🖼 ${esc(x.name)}${x.use_count ? ' (✓' + x.use_count + ')' : ''}</option>`).join(''); }).catch(() => {});
  $('#grid').addEventListener('click', e => {
    const card = e.target.closest('.pick'); if (!card) return;
    const id = +card.dataset.id, box = e.target.closest('input[type=checkbox]');
    if (!box && !e.shiftKey && !e.metaKey) { location.href = '/editor?item=' + id; return; }
    e.preventDefault();
    const ids = pickState.items.map(i => i.id), on = !pickState.chosen.has(id);
    if (e.shiftKey && pickState.last != null) {
      const [a, b] = [ids.indexOf(pickState.last), ids.indexOf(id)].sort((x, y) => x - y);
      ids.slice(a, b + 1).forEach(x => on ? pickState.chosen.add(x) : pickState.chosen.delete(x));
    } else on ? pickState.chosen.add(id) : pickState.chosen.delete(id);
    pickState.last = id; markChosen();
  });
  $('#all').onclick = () => { pickState.items.forEach(i => pickState.chosen.add(i.id)); markChosen(); };
  $('#none').onclick = () => { pickState.chosen.clear(); markChosen(); };
  $('#apply').onclick = async () => {
    try { const r = await api(`/api/editor/templates/${$('#tpl').value}/apply`, { method: 'POST', body: JSON.stringify({ item_ids: [...pickState.chosen], export: true, background: $('#bgSel').value || null }) });
      const bad = Object.keys(r.errors).length;
      toast(`В очереди на монтаж: ${r.applied.length}${bad ? `, не получилось: ${bad} (${Object.values(r.errors)[0]})` : ''}`, bad ? 'err' : 'ok');
      pickState.chosen.clear(); loadPick();
    } catch (e) { toast(e.message, 'err'); }
  };
  await loadPick();
  setInterval(progress, 2500); progress();
}

async function loadPick() {
  const qs = new URLSearchParams(); if (pickState.onlyNew) qs.set('only_new', 'true'); if (pickState.checked) qs.set('checked_channels', 'true');
  const all = (await api('/api/editor/items?' + qs)).items;
  pickState.items = all.filter(i => (!pickState.cat || i.category === pickState.cat) && (!pickState.txt || (pickState.txt === 'yes') === !!i.has_text));
  const cats = {}; all.forEach(i => cats[i.category] = (cats[i.category] || 0) + 1);
  $('#filt').innerHTML = `<button class="chip ${pickState.onlyNew ? 'on' : ''}" data-new="1">Новые</button><button class="chip ${pickState.onlyNew ? '' : 'on'}" data-new="0">Все</button>
    <button class="chip ${pickState.txt === 'no' ? 'on' : ''}" data-txt="no" title="без надписей в кадре">без текста</button><button class="chip ${pickState.txt === 'yes' ? 'on' : ''}" data-txt="yes">🔤 с текстом</button>
    <button class="chip ${pickState.checked ? 'on' : ''}" data-checked="1" title="Только с каналов, отмеченных сейчас в «Источниках»">✓ отмеченные каналы</button>
    <span style="width:10px"></span><button class="chip ${pickState.cat ? '' : 'on'}" data-cat="">Все категории<span class="n">${all.length}</span></button>` +
    Object.entries(cats).map(([c, n]) => `<button class="chip ${pickState.cat === c ? 'on' : ''}" data-cat="${c}">${esc((CATEGORIES.find(x => x.id === c) || {}).label || c || '—')}<span class="n">${n}</span></button>`).join('');
  $$('#filt [data-new]').forEach(b => b.onclick = () => { pickState.onlyNew = b.dataset.new === '1'; loadPick(); });
  $$('#filt [data-txt]').forEach(b => b.onclick = () => { pickState.txt = pickState.txt === b.dataset.txt ? '' : b.dataset.txt; loadPick(); });
  $$('#filt [data-checked]').forEach(b => b.onclick = () => { pickState.checked = !pickState.checked; loadPick(); });
  $$('#filt [data-cat]').forEach(b => b.onclick = () => { pickState.cat = b.dataset.cat; loadPick(); });
  $('#grid').innerHTML = pickState.items.map(i => `
      <div class="pick" data-id="${i.id}">
        <input type="checkbox" data-id="${i.id}">
        <img loading="lazy" src="${i.thumbnail}" alt="">
        <div class="cap"><div><b>${esc(i.title || '#' + i.id)}</b></div>
          <div class="row" style="gap:4px">${catBadge(i.category, i.category_label)}<span class="st" data-st="${i.id}">${stBadge(i.edit_state)}</span>${i.has_text == null ? '' : i.has_text ? `<span class="badge info" title="${esc('В кадре: ' + (i.screen_text || ''))}">🔤 текст</span>` : '<span class="badge">без текста</span>'}${i.in_ready ? '<span class="badge ok">в «Готовых»</span>' : ''}</div></div>
      </div>`).join('') || `<div class="card empty" style="grid-column:1/-1"><b>${pickState.onlyNew ? 'Новых роликов нет' : 'Роликов пока нет'}</b>${pickState.onlyNew ? 'Всё уже в «Готовых». Нажмите «Все», чтобы увидеть остальные.' : 'Сюда попадают скачанные и разобранные ролики.'}</div>`;
  markChosen();
}
const stBadge = st => st ? `<span class="badge ${st === 'done' ? 'ok' : st === 'error' ? 'err' : 'info'}">${{ queued: 'в очереди', rendering: 'монтаж…', done: 'смонтирован', error: 'ошибка' }[st]}</span>` : '';
function markChosen() {
  $$('.pick').forEach(c => { const on = pickState.chosen.has(+c.dataset.id); c.classList.toggle('sel', on); $('input', c).checked = on; });
  $('#selN').textContent = 'выбрано: ' + pickState.chosen.size; $('#apply').disabled = !pickState.chosen.size || !TEMPLATES.length;
}
async function progress() {
  try {
    const q = await api('/api/editor/queue');
    const left = q.queued + q.rendering;
    $('#progress').innerHTML = left ? `<span class="dot busy"></span>Монтаж в фоне: осталось <b>${left}</b>${q.error ? `, ошибок: ${q.error}` : ''}. Готовые ролики сами появляются в «Готовых».` : (q.error ? `<span style="color:var(--err)">Ошибок монтажа: ${q.error} — откройте ролик, чтобы увидеть причину.</span>` : '');
    $$('[data-st]').forEach(el => { const st = q.items[el.dataset.st]; if (st) el.innerHTML = stBadge(st); else if (/очереди|монтаж…/.test(el.textContent)) el.innerHTML = stBadge('done'); });
  } catch { }
}
function renderAuto(mapping) {
  const cats = ['sports', 'stream_clips', 'memes', 'funny', 'gaming', 'animals'].map(id => CATEGORIES.find(c => c.id === id)).filter(Boolean);
  $('#auto').innerHTML = `<p class="note">Новые ролики этой категории сами получают шаблон и уходят в «Готовые». Ролики, открытые в редакторе, не трогаются.</p>` +
    cats.map(c => `<label class="row small" style="justify-content:space-between">${esc(c.label)}<select data-auto="${c.id}" style="width:230px"><option value="">выключено</option>${TEMPLATES.map(t => `<option value="${t.id}" ${mapping[c.id] === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>`).join('');
  $$('[data-auto]').forEach(s => s.onchange = async () => {
    const m = {}; $$('[data-auto]').forEach(x => m[x.dataset.auto] = x.value ? +x.value : null);
    try { await api('/api/editor/auto-templates', { method: 'PUT', body: JSON.stringify({ mapping: m }) }); toast(s.value ? 'Авто-шаблон включён' : 'Авто-шаблон выключен', 'ok'); } catch (e) { toast(e.message, 'err'); }
  });
}

// ================= controls =================
const seg = (path, opts) => `<div class="seg" data-seg="${path}">${opts.map(([v, t]) => `<button type="button" data-v="${v}">${t}</button>`).join('')}</div>`;
// slider: `fmt` turns the stored value into the label
const rng = (path, label, min, max, step, unit = '') => `<label class="sl"><span class="top">${label}<span data-show="${path}" data-unit="${unit}"></span></span><input type="range" data-path="${path}" min="${min}" max="${max}" step="${step}"></label>`;
const col = (path, label) => `<label class="row small" style="gap:8px">${label}<input type="color" data-path="${path}"></label>`;
const chk = (path, label) => `<label class="row small" style="gap:6px"><input type="checkbox" data-path="${path}"> ${label}</label>`;

function assetPicker(kind, path, allowNone = true) {
  const list = ASSETS.filter(a => kind.includes(a.kind)), cur = get(S, path);
  return `<div class="assets" data-assets="${path}">
    ${allowNone ? `<div class="asset ${cur ? '' : 'on'}" data-aid="" style="display:grid;place-items:center;background:var(--surface-2);font-size:12px;color:var(--muted)">нет</div>` : ''}
    ${list.map(a => `<div class="asset ${a.id === cur ? 'on' : ''}" data-aid="${a.id}" title="${esc(a.name)}">${a.preview ? `<img src="${a.preview}" alt="">` : `<div style="display:grid;place-items:center;height:100%;font-size:11px;padding:4px;text-align:center">🎵 ${esc(a.name)}</div>`}<span class="k">${a.kind === 'video' ? 'видео' : a.kind === 'audio' ? 'звук' : ''}</span></div>`).join('')}
  </div>
  <label class="btn sm" style="justify-self:start">＋ Загрузить файл<input type="file" hidden data-upload="${path}" accept="${kind.includes('audio') ? 'audio/*' : 'image/*,video/*'}"></label>`;
}

// backgrounds from the «Фоны» library (used ones marked), then other uploaded pictures/videos
function bgPicker() {
  const cur = S.background.asset, lib = ASSETS.filter(a => a.role === 'background' && a.kind !== 'audio');
  const other = ASSETS.filter(a => a.role !== 'background' && ['image', 'video'].includes(a.kind));
  const tile = a => `<div class="asset ${a.id === cur ? 'on' : ''}" data-bg="${a.id}" title="${esc(a.name)}${a.use_count ? ' · использован ' + a.use_count + ' раз' : ''}"><img loading="lazy" src="${a.preview}" alt="">${a.use_count ? `<span class="k" style="left:auto;right:2px;background:#16a34a">✓${a.use_count}</span>` : ''}${a.kind === 'video' ? '<span class="k">видео</span>' : ''}</div>`;
  return `<div class="assets" style="max-height:300px;overflow:auto">${lib.map(tile).join('') || '<p class="note" style="grid-column:1/-1">В «Фонах» пока пусто — загрузите туда картинки или видео.</p>'}</div>

}
function setBackground(id) {
  const a = ASSETS.find(x => x.id === id); if (!a) return;

function renderPanel() {
  const open = $$('#panel details').map(d => d.open);
  $('#panel').innerHTML = panels();
  if (open.length) $$('#panel details').forEach((d, i) => { if (i < open.length) d.open = open[i]; });
  $('#texts').innerHTML = textCards();
  bindPanel();
  syncControls();
  drawTemplateThumbs();
}

function syncControls() {
  const vs = videoSize();
  $$('[data-path]').forEach(el => {
    const v = el.dataset.path === 'video._size' ? vs : get(S, el.dataset.path);
    if (el.type === 'checkbox') el.checked = !!v;
    else if (document.activeElement !== el) el.value = v ?? '';
  });
  $$('[data-show]').forEach(el => {
    const v = el.dataset.show === 'video._size' ? vs : get(S, el.dataset.show);
    el.textContent = typeof v === 'number' ? (Math.round(v * 100) / 100) + (el.dataset.unit || '') : '';
  });
  $$('[data-seg]').forEach(el => $$('button', el).forEach(b => b.classList.toggle('on', String(get(S, el.dataset.seg)) === b.dataset.v)));
  $$('[data-when]').forEach(el => {
    const neg = el.dataset.when.includes('!='), [path, vals] = el.dataset.when.split(/!?=/);
    const hit = vals.split(',').includes(String(get(S, path) ?? ''));
    el.hidden = neg ? hit : !hit;
  });
  $$('[data-assets]').forEach(el => $$('.asset', el).forEach(a => a.classList.toggle('on', (get(S, el.dataset.assets) || '') === a.dataset.aid)));
  if ($('#texts') && $$('.tcard').length !== S.texts.length) { $('#texts').innerHTML = textCards(); bindPanel($('#texts')); syncControls(); return; }
  $$('.tcard').forEach(c => c.classList.toggle('sel', sel.kind === 'text' && sel.i === +c.dataset.tcard));
  const T = total();
  at = Math.min(at, T);
  $('#t').max = T.toFixed(2); $('#t').value = at; $('#tl').textContent = `${fmt(at)} / ${fmt(T)}`;
  syncTrim();
}

// video size slider: width in % of the canvas width, keeping the window's proportions and centre
function videoSize() { return Math.round(S.video.w / CW * 100); }
function setVideoSize(p) {
  const v = S.video, cx = v.x + v.w / 2, cy = v.y + v.h / 2, ratio = v.h / v.w;
  v.w = even(CW * p / 100); v.h = even(v.w * ratio); v.x = Math.round(cx - v.w / 2); v.y = Math.round(cy - v.h / 2);
}

function changed(opts = {}) {
  dirty = true; showState(); syncControls(); boxes(); redraw(); hideExact();
  clearTimeout(saveTimer); saveTimer = setTimeout(autosave, 900);
  if (opts.thumbs) drawTemplateThumbs();
  drawSubStyles();
}

function bindPanel(root = document) {
  $$('[data-path]', root).forEach(el => {
    const handler = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'range') v = +v;
      if (el.dataset.path === 'video._size') setVideoSize(v); else set(S, el.dataset.path, v);
      changed();
    };
    el.oninput = handler; el.onchange = null;
    if (el.type === 'checkbox' || el.type === 'color') { el.oninput = null; el.onchange = handler; if (el.type === 'color') el.oninput = handler; }
  });
  $$('[data-seg]', root).forEach(el => el.onclick = e => { const b = e.target.closest('button'); if (!b) return; set(S, el.dataset.seg, b.dataset.v); changed(); });
  $$('[data-assets]', root).forEach(el => el.onclick = e => {
    const a = e.target.closest('.asset'); if (!a) return;
    set(S, el.dataset.assets, a.dataset.aid || null);
    const meta = ASSETS.find(x => x.id === a.dataset.aid);
    if (el.dataset.assets === 'banner.asset' && meta && meta.key_color) { S.banner.chroma.enabled = true; S.banner.chroma.color = meta.key_color; toast('Нашёл хромакей ' + meta.key_color + ' — он будет убран', 'ok'); }
    if (el.dataset.assets === 'banner.asset' && meta) sel = { kind: 'banner' };
    loadAsset(meta).then(() => redraw());
    changed();
  });
  $$('[data-upload]', root).forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('file', f);
    toast('Загружаю ' + f.name + '…');
    try {
      const r = await fetch('/api/editor/assets', { method: 'POST', body: fd }); const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      ASSETS = (await api('/api/editor/assets')).assets;
      set(S, inp.dataset.upload, j.id);
      if (inp.dataset.upload === 'banner.asset') { sel = { kind: 'banner' }; if (j.key_color) { S.banner.chroma.enabled = true; S.banner.chroma.color = j.key_color; toast('Хромакей ' + j.key_color + ' найден и будет убран', 'ok'); } }
      await loadAsset(ASSETS.find(a => a.id === j.id));
      renderPanel(); changed();
    } catch (e) { toast(e.message, 'err'); }
  });
  $$('[data-deltext]', root).forEach(b => b.onclick = () => { S.texts.splice(+b.dataset.deltext, 1); sel = { kind: 'video' }; changed(); });
  $$('[data-tcard]', root).forEach(c => c.onfocusin = () => { sel = { kind: 'text', i: +c.dataset.tcard }; boxes(); syncControls(); });
  if (root !== document) return;
  $$('[data-tpl]').forEach(b => b.onclick = () => applyTemplate(+b.dataset.tpl));
  $$('[data-bg]').forEach(t => t.onclick = () => setBackground(t.dataset.bg));
  if ($('#randBg')) $('#randBg').onclick = () => {
    const lib = ASSETS.filter(a => a.role === 'background' && a.id !== S.background.asset);
    if (!lib.length) return toast('В «Фонах» пока нет фонов', 'err');
    const min = Math.min(...lib.map(a => a.use_count)), pool = lib.filter(a => a.use_count === min);
    setBackground(pool[Math.floor(Math.random() * pool.length)].id);
  };
  $$('[data-substyle]').forEach(b => b.onclick = () => {
    Object.assign(S.subtitles, SUB_STYLES[b.dataset.substyle], { preset: b.dataset.substyle }); delete S.subtitles.label;
    $$('[data-substyle]').forEach(x => x.classList.toggle('on', x === b)); sel = { kind: 'subs' }; changed();
  });
  drawSubStyles();
  const ven = $('[data-path="voice.enabled"]');
  if (ven) ven.addEventListener('change', () => {
    if (ven.checked && !S.voice.text.trim()) { S.voice.text = P.item.description || P.item.transcript || P.item.caption || ''; syncControls(); }
    if (ven.checked && !VOICES.some(v => v.id === S.voice.voice) && VOICES.length) S.voice.voice = VOICES[0].id;
  });
  if ($('#listen')) $('#listen').onclick = async () => {
    const b = $('#listen'); b.disabled = true; b.textContent = 'Синтезирую…';
    try { const a = await voiceFile(); if (voiceAudio) voiceAudio.pause(); voiceAudio = new Audio(a.url); voiceAudio.volume = Math.min(1, S.voice.volume); voiceAudio.play(); }
    catch (e) { toast(e.message, 'err'); } finally { b.disabled = false; b.textContent = '▶ Прослушать'; }
  };
  $('#addText').onclick = () => {
    S.texts.push({ ...clone(TEXT_NEW), y: 200 + S.texts.length * 160 });
    sel = { kind: 'text', i: S.texts.length - 1 }; changed();
    setTimeout(() => $(`[data-path="texts.${sel.i}.text"]`)?.focus(), 30);
  };
  $('#fitWin').onclick = async () => { try { S = (await api('/api/editor/fit-window', { method: 'POST', body: JSON.stringify({ spec: S }) })).spec; sel = { kind: 'video' }; changed(); toast('Видео вписано в окно баннера', 'ok'); } catch (e) { toast(e.message, 'err'); } };
  $('#tplSave').onclick = async () => { try { await api('/api/editor/templates', { method: 'POST', body: JSON.stringify({ name: $('#tplName').value, spec: S }) }); TEMPLATES = (await api('/api/editor/templates')).templates; toast('Шаблон сохранён', 'ok'); renderPanel(); } catch (e) { toast(e.message, 'err'); } };
  $('#tplDel').onclick = async () => { const id = +$('#tplDelSel').value; if (!id || !confirm('Удалить шаблон?')) return; await api('/api/editor/templates/' + id, { method: 'DELETE' }); TEMPLATES = (await api('/api/editor/templates')).templates; renderPanel(); };
  $('#exactToggle').onchange = () => { $('#exactToggle').checked ? scheduleExact() : hideExact(); };
  $('#reset').onclick = async () => { if (!confirm('Сбросить всё оформление этого ролика?')) return; await api('/api/editor/' + itemId, { method: 'DELETE' }); dirty = false; location.reload(); };
  bindTrim();
}
// a synthesized voice-over file for the current text/voice/speed (cached by the server)
let voiceCache = { key: null, res: null };
async function voiceFile() {
  const v = S.voice, key = [v.text, v.voice, v.speed].join('|');
  if (voiceCache.key === key) return voiceCache.res;
  if (!v.text.trim()) throw new Error('впишите текст для озвучки');
  const res = await api('/api/editor/tts', { method: 'POST', body: JSON.stringify({ text: v.text, voice: v.voice, speed: v.speed }) });
  voiceCache = { key, res };
  return res;
}

function drawSubStyles() {
  $$('[data-substyle]').forEach(b => {
    const cv = $('canvas', b), ctx = cv.getContext('2d'), k = cv.width / 400;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save(); ctx.scale(k, k); ctx.translate(-340, -(S.subtitles.y) + 80);

// ================= stage: boxes, drag, resize, snapping =================
function layerRects() {

  const a = ASSETS.find(x => x.id === S.banner.asset);

  }

}
// height of a two-line subtitle in the current style (app/editor/subs.py layout)
function subsHeight() {
  const sub = S.subtitles, size = Math.floor(sub.size), stroke = sub.stroke > 0 ? Math.floor(size * sub.stroke) : 0;
  return Math.floor(size * 1.25) * 2 + Math.max(stroke * 2, Math.floor(size / 3)) * 2;

const isSel = r => r.kind === sel.kind && (r.kind !== 'text' || r.i === sel.i);

function boxes() {
  const ov = $('#ov'); if (!ov) return;

    Object.assign(el.style, { left: r.x * D + 'px', top: r.y * D + 'px', width: r.w * D + 'px', height: r.h * D + 'px' });
    const hs = r.kind === 'video' ? ['nw', 'ne', 'sw', 'se', 'n', 's', 'e', 'w'] : r.kind === 'text' ? ['nw', 'ne', 'sw', 'se', 'e', 'w'] : r.kind === 'subs' ? ['ne', 'se'] : ['nw', 'ne', 'sw', 'se'];

function startDrag(e, r, el) {

    syncControls(); redraw();

function setPos(r, x, y) {
  if (r.kind === 'subs') S.subtitles.y = Math.round(Math.max(100, Math.min(CH - 100, y + r.h / 2)));
  else if (r.kind === 'video') Object.assign(S.video, { x: Math.round(x), y: Math.round(y) });
  else if (r.kind === 'banner') Object.assign(S.banner, { x: Math.round(x), y: Math.round(y) });

}
function move(r0, dx, dy, free) {
  let x = r0.x + (r0.kind === 'subs' ? 0 : dx), y = r0.y + dy;
  const snap = 14 / D * 0.5;  // a few screen pixels
  let gv = false, gh = false;
  if (!free) {

    if (Math.abs(y + r0.h / 2 - CH / 2) < snap) { y = CH / 2 - r0.h / 2; gh = true; }
    if (Math.abs(x) < snap) x = 0; if (Math.abs(y) < snap) y = 0;
    if (Math.abs(x + r0.w - CW) < snap) x = CW - r0.w; if (Math.abs(y + r0.h - CH) < snap) y = CH - r0.h;

function resize(r0, s0, h, dx, dy, free) {

  }

  if (r0.kind === 'subs') { S.subtitles.size = Math.max(32, Math.min(140, Math.round(s0.subtitles.size * hh / r0.h))); return; }
  if (r0.kind === 'video') Object.assign(S.video, { x: Math.round(x), y: Math.round(y), w: even(w), h: even(hh) });
  else if (r0.kind === 'banner') { S.banner.scale = Math.max(0.05, Math.round(w / CW * 1000) / 1000); S.banner.x = Math.round(left ? r0.x + r0.w - even(CW * S.banner.scale) : r0.x); S.banner.y = Math.round(top ? r0.y + r0.h - even(even(CW * S.banner.scale) * r0.h / r0.w) : r0.y); }

}

function placePreset(pos) {
  const r = layerRects().find(isSel) || layerRects()[0];
  const TOP = 220, BOTTOM = 340;  // keep clear of Instagram's own buttons and caption

    else if (r.kind === 'banner') Object.assign(S.banner, { x: 0, y: 0, scale: 1 });

// ================= live preview =================
function loadAsset(a) {
  if (!a || media.assets[a.id] || a.kind === 'audio') return Promise.resolve();
  return new Promise(res => {
    if (a.kind === 'image') { const im = new Image(); im.onload = im.onerror = res; im.src = a.file; media.assets[a.id] = { el: im, kind: 'image', width: a.width, height: a.height }; }
    else { const v = document.createElement('video'); v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto'; v.src = a.file;
      v.onloadeddata = v.onerror = res; media.assets[a.id] = { el: v, kind: 'video', width: a.width, height: a.height }; }
  });
}

let drawQueued = false;
function redraw() { if (drawQueued) return; drawQueued = true; requestAnimationFrame(() => { drawQueued = false; comp.draw(S, at); }); }

// seek every video to the current result time, then draw (scrubbing and edits while paused)
let seeking = false, seekAgain = false, firstSeek = false;
function seek() {
  if (playing) return;
  if (seeking) { seekAgain = true; return; }
  seeking = true;
  const st = sourceTime(S, P.item.duration, at), src = media.src;
  const target = st == null ? S.time.trim_start : st;
  const jobs = [];
  if (Math.abs(src.currentTime - target) > 0.01) jobs.push(new Promise(r => { src.addEventListener('seeked', r, { once: true }); src.currentTime = target; setTimeout(r, 1500); }));
  for (const a of Object.values(media.assets)) if (a.kind === 'video' && a.el.duration) {
    const t = at % a.el.duration; if (Math.abs(a.el.currentTime - t) > 0.04) jobs.push(new Promise(r => { a.el.addEventListener('seeked', r, { once: true }); a.el.currentTime = t; setTimeout(r, 1500); }));
  }
  Promise.all(jobs).then(() => { seeking = false; redraw(); if (firstSeek) { firstSeek = false; drawTemplateThumbs(); } if (seekAgain) { seekAgain = false; seek(); } else scheduleExact(); });
}

function play() {
  if (playing) return stop();
  if (at >= total() - 0.05) at = 0;
  playing = true; hideExact(); $('#stage').classList.add('playing'); $('#play').textContent = '❚❚';
  const src = media.src, d = S.time.start_delay, wall0 = performance.now(), t0 = at;
  src.muted = false; src.volume = Math.min(1, S.audio.volume); src.playbackRate = S.time.speed;
  const music = S.audio.music && ASSETS.find(a => a.id === S.audio.music);
  if (music) { media.music = media.music || new Audio(); if (!media.music.src.endsWith(music.file)) media.music.src = music.file;
    media.music.loop = true; media.music.volume = Math.min(1, S.audio.music_volume); media.music.currentTime = t0; media.music.play().catch(() => {}); }
  for (const a of Object.values(media.assets)) if (a.kind === 'video') a.el.play().catch(() => {});
  let voiceEnd = -1;
  if (S.voice.enabled && S.voice.text.trim()) voiceFile().then(r => {
    if (!playing) return;
    voiceAudio && voiceAudio.pause(); voiceAudio = new Audio(r.url); voiceAudio.volume = Math.min(1, S.voice.volume);
    voiceEnd = d + (r.duration || 0);
    const off = at - d;
    if (off < (r.duration || 0)) { const go = () => { voiceAudio.currentTime = Math.max(0, at - d); voiceAudio.play().catch(() => {}); };
      off >= 0 ? go() : setTimeout(() => playing && go(), -off * 1000); }
  }).catch(e => toast('Озвучка: ' + e.message, 'err'));
  const started = () => { const st = sourceTime(S, P.item.duration, Math.max(at, d)); src.currentTime = st; src.play().catch(() => {}); };
  if (t0 >= d) started();

    if (at >= total() - 0.02 || src.ended) { at = total(); stop(); return; }

function stop() {

// the exact FFmpeg frame for the current spec, shown on pause (same pixels as the export)
function hideExact() { exactSeq++; clearTimeout(exactTimer); const im = $('#exact'); if (im) im.hidden = true; }
function scheduleExact() {

  const seq = ++exactSeq, spec = JSON.stringify({ spec: S, at });
  exactTimer = setTimeout(async () => {
    try {
      const r = await fetch(`/api/editor/${itemId}/frame`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: spec });

// ================= saving and export =================

  const map = { queued: 'монтаж в очереди…', rendering: 'идёт монтаж…', done: P.up_to_date && !dirty ? 'в «Готовых» ✓' : '', error: 'ошибка монтажа: ' + (P.render_error || '') };
  st.textContent = extra || [dirty ? 'сохраняю…' : 'сохранено', map[P.render_state]].filter(Boolean).join(' · ');
  st.style.color = P.render_state === 'error' ? 'var(--err)' : '';
}
async function autosave() {
  try { await api('/api/editor/' + itemId, { method: 'PUT', body: JSON.stringify({ spec: S }) }); dirty = false; P.up_to_date = false; showState(); }
  catch (e) { showState('не сохранилось: ' + e.message); }
}

async function openEditor() {
  [P, { assets: ASSETS }, { templates: TEMPLATES }, { voices: VOICES }] = await Promise.all([api('/api/editor/' + itemId), api('/api/editor/assets'), api('/api/editor/templates'), api('/api/editor/voices')]);
  S = P.spec;
  at = Math.min(S.time.start_delay + 1, total());
  const src = document.createElement('video');
  src.muted = true; src.playsInline = true; src.preload = 'auto'; src.src = P.source_url;
  media = { src, srcW: P.item.width, srcH: P.item.height, duration: P.item.duration, assets: {}, cues: P.cues || [] };
  editorLayout();
  comp = new Composer($('#cv'), media);
  const onReady = () => { media.srcW = src.videoWidth || media.srcW; media.srcH = src.videoHeight || media.srcH; firstSeek = true; seek(); };
  if (src.readyState >= 2) onReady(); else src.addEventListener('loadeddata', onReady, { once: true });
  await Promise.all([S.banner.asset, S.background.asset].map(id => loadAsset(ASSETS.find(a => a.id === id))));
  src.addEventListener('error', () => {
    // the browser cannot decode this file: show the FFmpeg frame instead of the live picture
    $('#stage').insertAdjacentHTML('beforeend', '<div class="fallback">Браузер не умеет показывать этот формат вживую — показываю кадры из FFmpeg.</div>');
    scheduleExact();
  });
  boxes(); showState();
  $('#t').oninput = () => { if (playing) stop(); at = +$('#t').value; syncControls(); hideExact(); seek(); };
  $('#play').onclick = play;
  $$('#pos [data-pos]').forEach(b => b.onclick = () => placePreset(b.dataset.pos));
  $('#stage').onpointerdown = e => { if (e.target.closest('.box')) return; sel = { kind: 'video' }; boxes(); syncControls(); };
  const it = P.item;
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1); $('#trash').onclick = trashAndNext;
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.code === 'Space') { e.preventDefault(); play(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel.kind === 'text') { S.texts.splice(sel.i, 1); sel = { kind: 'video' }; changed(); }
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];

  });
  $('#export').onclick = async () => {
    clearTimeout(saveTimer);
    try { await api(`/api/editor/${itemId}/export`, { method: 'POST', body: JSON.stringify({ spec: S, to_ready: true }) }); dirty = false; P.render_state = 'queued'; showState(); toast('Монтирую в полном качестве — ролик сам появится в «Готовых»', 'ok'); poll(); }
    catch (e) { toast(e.message, 'err'); }
  };
  window.addEventListener('beforeunload', e => { if (dirty) { autosave(); e.preventDefault(); e.returnValue = ''; } });

}

// neighbours in the editor list («new» videos first: the ones not in «Готовые» yet)
let NAV = null;
async function neighbour(dir) {
  NAV = NAV || (await api('/api/editor/items?only_new=true')).items.map(i => i.id);
  let ids = NAV, i = ids.indexOf(itemId);
  if (i < 0) { ids = [...ids, itemId].sort((a, b) => b - a); i = ids.indexOf(itemId); }
  return ids[i + dir] || null;
}
async function go(dir, after = '') {
  if (dirty) { clearTimeout(saveTimer); await autosave(); }
  const id = await neighbour(dir);
  if (!id) { toast(dir > 0 ? 'Это последний новый ролик' : 'Это первый ролик'); return; }
  location.href = '/editor?item=' + id + after;
}
async function exportAndNext() {
  clearTimeout(saveTimer);
  try { await api(`/api/editor/${itemId}/export`, { method: 'POST', body: JSON.stringify({ spec: S, to_ready: true }) }); dirty = false;
    sessionStorage.setItem('edToast', 'Ролик #' + itemId + ' монтируется и сам попадёт в «Готовые»'); go(1); }
  catch (e) { toast(e.message, 'err'); }
}
async function trashAndNext() {
  try { await api(`/api/items/${itemId}/trash`, { method: 'POST' }); dirty = false; clearTimeout(saveTimer);
    sessionStorage.setItem('edUndo', String(itemId)); const id = await neighbour(1) || await neighbour(-1);
    location.href = id ? '/editor?item=' + id : '/editor'; }
  catch (e) { toast(e.message, 'err'); }
}
function showCarryOver() {
  try {
    const t = sessionStorage.getItem('edToast'); if (t) { sessionStorage.removeItem('edToast'); toast(t, 'ok'); }
    const u = sessionStorage.getItem('edUndo'); if (!u) return;
    sessionStorage.removeItem('edUndo');
    const bar = document.createElement('div'); bar.className = 'toast'; bar.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;gap:12px;align-items:center';
    bar.innerHTML = `Ролик #${u} в корзине <button class="btn sm">Вернуть</button>`;
    $('button', bar).onclick = async () => { await api(`/api/items/${u}/restore`, { method: 'POST' }); bar.remove(); toast('Ролик возвращён', 'ok'); };
    document.body.append(bar); setTimeout(() => bar.remove(), 10000);
  } catch { }
}

async function poll() {
  const p = await api('/api/editor/' + itemId);
  Object.assign(P, { render_state: p.render_state, render_error: p.render_error, up_to_date: p.up_to_date });
  showState();
  if (['queued', 'rendering'].includes(p.render_state)) setTimeout(poll, 2000);
  else if (p.render_state === 'done') toast('Готово: ролик в «Готовых»', 'ok');
  else if (p.render_state === 'error') toast('Монтаж не получился: ' + p.render_error, 'err');
}

(async () => { await loadCategories(); showCarryOver(); itemId ? openEditor().catch(e => { $('#main').innerHTML = `<div class="card empty"><b>Не открылось</b>${esc(e.message)}</div>`; renderSidebar('editor'); }) : picker(); })();
</script>
