<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фоны — Контент-завод</title>
<link rel="stylesheet" href="/static/app.css?v=14">
<style>
  .drop { display: block; border: 2px dashed var(--line-2); border-radius: var(--r); padding: 28px; text-align: center; color: var(--text-2); background: var(--surface); cursor: pointer; transition: .15s; }
  .drop.over { border-color: var(--accent); background: var(--accent-2); }
  .drop b { display: block; font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .bg { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
  .bg img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: var(--surface-2); }
  .bg.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
  .bg .ck { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; }
  .bg .used { position: absolute; top: 8px; right: 8px; }
  .bg .kind { position: absolute; bottom: 44px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; }
  .bg .cap { font-size: 11px; padding: 5px 7px; color: var(--text-2); display: grid; gap: 2px; }
  .bg .cap div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { position: sticky; top: 0; z-index: 5; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="page-head"><div><h1>Фоны</h1>
      <p class="sub">Библиотека фонов для редактора: картинки и видео (видео зацикливается на всю длину ролика). Использованные помечаются.</p></div></div>
    <label class="drop" id="drop"><b>Перетащите сюда картинки или видео — можно сразу много</b>или нажмите, чтобы выбрать файлы · jpg, png, webp, mp4, mov
      <input type="file" id="file" multiple accept="image/*,video/*" hidden></label>
    <div class="row" style="margin:10px 0 16px"><span class="small muted">Папка для новых:</span>
      <input type="text" id="newTag" list="tagList" placeholder="например: спорт" style="width:200px"><datalist id="tagList"></datalist>
      <span class="small muted" id="upState"></span></div>
    <section class="card bar" style="margin-bottom:14px;padding:12px 16px">
      <div class="row">
        <div class="chips" id="useF"><button class="chip on" data-u="">Все</button><button class="chip" data-u="unused">Неиспользованные</button><button class="chip" data-u="used">Использованные</button></div>
        <div class="chips" id="tagF"></div>
        <span class="spacer"></span><span class="small muted" id="tot"></span>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" id="all">выбрать все</button><button class="btn ghost sm" id="none">снять</button><span class="small muted" id="selN"></span>
        <span class="spacer"></span>
        <input type="text" id="setTag" list="tagList" placeholder="папка" style="width:150px"><button class="btn sm" id="tagBtn" disabled>Переложить</button>
        <button class="btn sm danger" id="delSel" disabled>Удалить выбранные</button>
        <button class="btn sm danger" id="delUsed">Удалить все использованные</button>
      </div>
    </section>
    <div class="bgs" id="grid"></div>
  </main>
</div>
<script src="/static/app.js?v=20"></script>
<script>
let F = { used: '', tag: '' }, DATA = { items: [] }, chosen = new Set(), last = null;
const mb = b => b >= 2 ** 30 ? (b / 2 ** 30).toFixed(1) + ' ГБ' : (b / 2 ** 20).toFixed(1) + ' МБ';

async function load() {
  const q = new URLSearchParams(); if (F.used) q.set('used', F.used); if (F.tag) q.set('tag', F.tag);
  DATA = await api('/api/backgrounds?' + q);
  $('#tot').textContent = `${DATA.total} ${plural(DATA.total, 'фон', 'фона', 'фонов')}, ${mb(DATA.bytes)}`;
  $('#tagList').innerHTML = DATA.tags.map(t => `<option value="${esc(t)}">`).join('');
  $('#tagF').innerHTML = DATA.tags.length ? `<button class="chip ${F.tag ? '' : 'on'}" data-t="">все папки</button>` + DATA.tags.map(t => `<button class="chip ${F.tag === t ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('') : '';
  $$('#tagF [data-t]').forEach(b => b.onclick = () => { F.tag = b.dataset.t; load(); });
  chosen = new Set([...chosen].filter(id => DATA.items.some(i => i.id === id)));
  $('#grid').innerHTML = DATA.items.map(i => `<div class="bg" data-id="${i.id}">
      <input type="checkbox" class="ck"><img loading="lazy" src="${i.preview}" alt="">
      ${i.use_count ? `<span class="badge ok used" title="последний раз ${new Date(i.last_used_at).toLocaleDateString('ru')}">✓ ${i.use_count}×</span>` : ''}
      ${i.kind === 'video' ? `<span class="kind">видео${i.duration ? ' ' + Math.round(i.duration) + ' с' : ''}</span>` : ''}
      <div class="cap"><div>${esc(i.name)}</div><div class="muted">${i.tag ? '📁 ' + esc(i.tag) + ' · ' : ''}${mb(i.size)}${i.in_unfinished ? ' · в работе' : ''}</div></div></div>`).join('')
    || `<div class="card empty" style="grid-column:1/-1"><b>${F.used || F.tag ? 'Ничего не нашлось' : 'Фонов пока нет'}</b>${F.used || F.tag ? 'Поменяйте фильтр.' : 'Перетащите картинки или видео в рамку выше.'}</div>`;
  mark();
}
function mark() {
  $$('.bg').forEach(c => { const on = chosen.has(c.dataset.id); c.classList.toggle('sel', on); $('.ck', c).checked = on; });
  $('#selN').textContent = chosen.size ? 'выбрано: ' + chosen.size : '';
  $('#delSel').disabled = $('#tagBtn').disabled = !chosen.size;
}
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.bg'); if (!c) return;
  e.preventDefault();
  const ids = DATA.items.map(i => i.id), id = c.dataset.id, on = !chosen.has(id);
  if (e.shiftKey && last) { const [a, b] = [ids.indexOf(last), ids.indexOf(id)].sort((x, y) => x - y); ids.slice(a, b + 1).forEach(x => on ? chosen.add(x) : chosen.delete(x)); }
  else on ? chosen.add(id) : chosen.delete(id);
  last = id; mark();
});
$$('#useF [data-u]').forEach(b => b.onclick = () => { F.used = b.dataset.u; $$('#useF .chip').forEach(x => x.classList.toggle('on', x === b)); load(); });
$('#all').onclick = () => { DATA.items.forEach(i => chosen.add(i.id)); mark(); };
$('#none').onclick = () => { chosen.clear(); mark(); };

async function remove(body) {
  const pv = await api('/api/backgrounds/delete', { method: 'POST', body: JSON.stringify(body) });
  if (!pv.count) return toast('Удалять нечего');
  const warn = pv.in_unfinished.length ? `\nВнимание: ${pv.in_unfinished.length} из них выбраны в ещё не смонтированных роликах (там будет размытый фон).` : '';
  if (!confirm(`Удалить ${pv.count} ${plural(pv.count, 'фон', 'фона', 'фонов')} (${mb(pv.bytes)})?${warn}`)) return;
  await api('/api/backgrounds/delete', { method: 'POST', body: JSON.stringify({ ...body, confirm: true }) });
  toast(`Удалено, освобождено ${mb(pv.bytes)}`, 'ok'); chosen.clear(); load();
}
$('#delSel').onclick = () => remove({ ids: [...chosen] });
$('#delUsed').onclick = () => remove({ all_used: true });
$('#tagBtn').onclick = async () => { await api('/api/backgrounds/tag', { method: 'POST', body: JSON.stringify({ ids: [...chosen], tag: $('#setTag').value }) }); toast('Готово', 'ok'); load(); };

async function upload(files) {
  files = [...files].filter(f => /^(image|video)\//.test(f.type) || /\.(jpe?g|png|webp|mp4|mov|m4v|webm)$/i.test(f.name));
  if (!files.length) return toast('Нужны картинки или видео', 'err');
  let done = 0, bad = 0;
  // a few files per request: big videos do not hit one huge upload
  for (let i = 0; i < files.length; i += 4) {
    const fd = new FormData(); files.slice(i, i + 4).forEach(f => fd.append('files', f));
    $('#upState').textContent = `Загружаю ${Math.min(i + 4, files.length)} из ${files.length}…`;
    try { const r = await fetch('/api/backgrounds?tag=' + encodeURIComponent($('#newTag').value), { method: 'POST', body: fd }); const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText); done += j.added.length; bad += Object.keys(j.errors).length; }
    catch (e) { bad += Math.min(4, files.length - i); toast(e.message, 'err'); }
  }
  $('#upState').textContent = ''; toast(`Добавлено фонов: ${done}${bad ? `, не получилось: ${bad}` : ''}`, bad ? 'err' : 'ok'); load();
}
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload(e.dataTransfer.files));
$('#file').onchange = () => { upload($('#file').files); $('#file').value = ''; };
renderSidebar('backgrounds');
load();
</script>
</body>
</html>
