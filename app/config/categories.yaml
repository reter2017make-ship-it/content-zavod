# Категории роликов. keywords — основы слов для оценки по правилам (без AI);
# слово должно начинаться с основы: «кот» совпадает с «котик», но не с «наркотик».
# AI-модель выбирает из этого же списка. uncertain = «не разобрался»: модель не угадывает.
categories:
